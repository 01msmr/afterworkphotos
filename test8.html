	     black: if iOS picks the status bar text colour from them rather than
	     from the pixels beneath, the text comes out black on black and the
	     status bar disappears along with the Face ID pill. The page's own
	     dark mode keys off prefers-color-scheme and is not affected. -->
	<meta name="color-scheme" content="light">
	<meta name="theme-color" content="#dedede">
	<title>awp test8</title>
	<link rel="stylesheet" href="res/main.css?v=20260827g">

	<!-- display:standalone is what makes the home screen icon launch as an app
	     rather than a browser window with a bar; the apple-* metas below are
	     the legacy path and no longer enough on their own -->
	<link rel="manifest" href="/test8-manifest.json">
	<meta name="apple-mobile-web-app-title" content="awp test8">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
