<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>gallery checks</title>
<style>
	body { margin: 0; background: #151412; color: #e8e4dc; font: 13px/1.5 ui-monospace, Menlo, monospace; display: flex; gap: 24px; padding: 16px; }
	iframe { border: 0; width: 900px; height: 560px; flex: none; background: #000; }
	#out { white-space: pre-wrap; flex: 1; }
	.ok { color: #7fd48a; } .fail { color: #f08a7a; } .warn { color: #d8c27a; }
	h1 { font-size: 13px; margin: 0 0 8px; }
</style>
</head>
<body>
<iframe id="f" src="../gallery/index.html"></iframe>
<div><h1>gallery checks — the bench in an iframe, driven through window.G</h1><div id="out">loading…</div></div>
<script>
/* Open from the local server with this window on screen (an occluded tab
   paints no frames). One line per check: ok / FAIL with what was seen. */
const out = document.getElementById('out');
const lines = []; let fails = 0;
function say(ok, name, seen) {
	lines.push(`<span class="${ok ? 'ok' : 'fail'}">${ok ? 'ok  ' : 'FAIL'}</span> ${name}${seen !== undefined ? '  <span class="warn">' + seen + '</span>' : ''}`);
	if (!ok) fails++;
	out.innerHTML = lines.join('\n');
}
const sleep = ms => new Promise(r => setTimeout(r, ms));
const f = document.getElementById('f');
f.addEventListener('load', () => run().catch(e => say(false, 'harness threw', e.stack || e.message)));

async function run() {
	const w = f.contentWindow;
	const errors = [];
	w.addEventListener('error', e => errors.push(e.message));
	const oe = w.console.error; w.console.error = (...a) => { errors.push(String(a[0]).slice(0, 90)); oe(...a); };
	for (let i = 0; i < 80 && !w.G; i++) await sleep(250);
	const G = w.G;
	say(!!G, 'the gallery booted (window.G)');
	if (!G) return;
	const THREE = await w.eval('import("/res/vendor/three.module.js")');
	const mod = name => w.eval(`import("gallery/${name}")`);
	const V3 = (...a) => new THREE.Vector3(...a);

	// 0. the tab paints
	let frames = 0; const stop = performance.now() + 500;
	await new Promise(r => { const g = () => { frames++; if (performance.now() < stop) w.requestAnimationFrame(g); else r(); }; w.requestAnimationFrame(g); });
	say(frames > 20, 'the tab paints (rAF runs)', `${frames} frames in 500 ms — if few, bring this window to the front and reload`);

	// 1. every module of the import map is served
	const map = JSON.parse(w.document.querySelector('script[type=importmap]').textContent).imports;
	const missing = [];
	for (const url of Object.values(map)) { const r = await fetch(url, { method: 'HEAD' }); if (!r.ok) missing.push(url); }
	say(!missing.length, `import map: ${Object.keys(map).length} modules served`, missing.join(' '));

	// 2. the loop runs every step; none has failed
	await sleep(300);
	const steps = Object.keys(G.frameCost.steps);
	say(steps.includes('render') && steps.includes('lift') && steps.includes('sticker') && steps.includes('paper'), 'frame loop: the steps run', steps.join(' '));
	say(!errors.length, 'no errors on the console', errors.slice(0, 3).join(' | '));

	// 3. the console: two plates, the favourites alone on top, the years on one line
	const caps = G.elevator.buttons.filter(b => b.userData.cap);
	const top = Math.max(...caps.map(c => c.position.y));
	const topRow = caps.filter(c => Math.abs(c.position.y - top) < 1e-6).map(c => c.userData.key);
	const second = caps.filter(c => Math.abs(c.position.y - (top - 0.04)) < 1e-6).map(c => c.userData.key);
	say(G.elevator.panel.children.filter(c => c.name === 'plate').length === 2, 'console: two plates');
	say(topRow.length === 1 && topRow[0] === 'favorites' && second.length >= 2, 'console: favourites alone on top, the years on one line below', `top ${topRow} · second ${second}`);

	// 4. a ride from inside the cabin, its frames
	G.elevator.placeInCabin(); G.stepWalk(performance.now());
	const from = G.state.roomKey, to = G.rooms().filter(r => !r.favs && r.key !== from)[1].key;
	const dts = []; let last = performance.now(), alive = true;
	(function loop() { if (!alive) return; const t = performance.now(); dts.push(t - last); last = t; w.requestAnimationFrame(loop); })();
	G.elevator.go(to);
	const t0 = performance.now(); while (G.elevator.ride && performance.now() - t0 < 30000) await sleep(200);
	alive = false;
	const worst = Math.max(...dts.slice(5));
	say(!G.elevator.ride && G.state.roomKey === to && G.elevator.open === 1, `ride ${from} → ${to} completes, doors open`, `${Math.round(performance.now() - t0)} ms`);
	say(worst < 45, 'ride: no frame over 45 ms on the bench', `worst ${worst.toFixed(0)} ms`);
	let photos = 0, withImg = 0; G.scene.getObjectByName('pieces').traverse(o => { if (o.name === 'photo') { photos++; if (o.material.map.image) withImg++; } });
	say(photos && photos === withImg, 'ride: every picture on the GPU when the doors open', `${withImg}/${photos}`);
	// a ride back: what the left room owned is gone again
	const live = () => { const set = new Set(); G.scene.traverse(o => { if (o.isMesh) set.add(o.geometry); }); return set.size; };   // the renderer's own geometry count follows the view
	const m0 = { ...G.renderer.info.memory, live: live() };
	G.elevator.placeInCabin(); G.stepWalk(performance.now()); G.elevator.go(from);
	const t1 = performance.now(); while (G.elevator.ride && performance.now() - t1 < 30000) await sleep(200);
	G.elevator.placeInCabin(); G.stepWalk(performance.now()); G.elevator.go(to);
	const t2 = performance.now(); while (G.elevator.ride && performance.now() - t2 < 30000) await sleep(200);
	const m1 = { ...G.renderer.info.memory, live: live() };
	say(m1.textures <= m0.textures + 2 && m1.live === m0.live, 'rides free what they leave (textures on the GPU, geometries in the scene)', `${m0.textures}/${m0.live} → ${m1.textures}/${m1.live}`);

	// 5. the pointer: the aiming hand wins over the hanging one
	const S = await mod('sticker');
	let print = null; G.scene.getObjectByName('pieces').traverse(o => { if (!print && o.name === 'photo' && !['cabin', 'mid'].includes(o.parent.parent.userData.wall)) print = o; });
	G.scene.updateMatrixWorld(true);
	const c = print.getWorldPosition(V3()), n = V3(0, 0, 1).applyQuaternion(print.getWorldQuaternion(new THREE.Quaternion()));
	const side = V3(n.z, 0, -n.x);
	const hand = (pos, dir) => { const o = new THREE.Object3D(); o.position.copy(pos); o.quaternion.setFromUnitVectors(V3(0, 0, -1), dir.clone().normalize()); o.updateMatrixWorld(true); return o; };
	const cursors = () => { const s = []; G.scene.traverse(o => { if (o.visible && /^(cursor-|held-)/.test(o.name || '')) s.push(o.name); }); return s.join(','); };
	const xr = G.renderer.xr, keep = xr.getController;
	const pointer = (D, atY) => {
		const body = c.clone().addScaledVector(n, D); body.y = 0;
		const rpos = body.clone().addScaledVector(side, 0.2); rpos.y = 1.1;
		const target = c.clone(); target.y = atY;
		const aim = hand(rpos, target.sub(rpos)), idle = hand(body.clone().addScaledVector(side, -0.25).setY(0.8), n.clone().multiplyScalar(-0.6).add(V3(0, -0.8, 0)));
		xr.isPresenting = true; xr.getController = i => [idle, aim][i];
		try { S.stepSticker(); } finally { xr.isPresenting = false; xr.getController = keep; }
		return cursors();
	};
	G.walk.pos.set(0, 1.6, 0); G.stepWalk(performance.now());
	say(pointer(2.5, c.y) === 'cursor-expand', 'pointer: brackets on a print at 2.5 m, the other hand hanging', pointer(2.5, c.y));
	say(pointer(1.0, c.y) === 'cursor-expand', 'pointer: brackets on a print at 1 m', pointer(1.0, c.y));
	say(pointer(2.5, 2.4) === 'held-dot', 'pointer: the dot on bare wall above the print, not on the floor', pointer(2.5, 2.4));

	// 6. the sheet: B pins it clear of frames; a press sets a line; the tape takes it down
	const P = await mod('paper');
	G.walk.pos.set(c.x + n.x * 1.3, 1.5, c.z + n.z * 1.3); G.walk.yaw = Math.atan2(n.x, n.z); G.walk.pitch = 0.5; G.stepWalk(performance.now());   // aimed above the pictures: a full wall would leave no free spot beside them
	G.scene.updateMatrixWorld(true); G.camera.updateMatrixWorld(true);
	if (P.paper.shown()) w.dispatchEvent(new w.KeyboardEvent('keydown', { code: 'KeyB' }));   // the one from the start, at your feet
	w.dispatchEvent(new w.KeyboardEvent('keydown', { code: 'KeyB' })); await sleep(150);
	const g = G.scene.getObjectByName('paper'); g.updateMatrixWorld(true);
	const sb = new THREE.Box3().setFromObject(g);
	let overlaps = 0; G.scene.getObjectByName('pieces').children.forEach(o => { if ((o.name || '').startsWith('piece-') && new THREE.Box3().setFromObject(o).expandByScalar(0.06).intersectsBox(sb)) overlaps++; });
	say(P.paper.shown() && !overlaps, 'sheet: B pins it, clear of every frame and label', `overlaps ${overlaps}`);
	const sheet = g.getObjectByName('sheet'), rc = new THREE.Raycaster();
	const at = (x, y) => { const p = V3((x / sheet.material.map.image.width - 0.5) * sheet.geometry.parameters.width, (0.5 - y / sheet.material.map.image.height) * sheet.geometry.parameters.height, 0); sheet.localToWorld(p); const o = G.camera.getWorldPosition(V3()); rc.set(o, p.sub(o).normalize()); return rc; };
	const area = key => P.paper.areas().find(a => a.line.key === key);
	const a = area('labels'), labels0 = G.state.settings.labels, pieces0 = G.scene.getObjectByName('pieces');
	P.paper.press(at((a.x0 + a.x1) / 2, (a.y0 + a.y1) / 2));
	say(G.state.settings.labels !== labels0 && P.paper.shown(), 'sheet: a press on a line sets it and the sheet stays');
	say(G.scene.getObjectByName('pieces') === pieces0, 'sheet: the option did not re-hang the room');
	P.paper.press(at((a.x0 + a.x1) / 2, (a.y0 + a.y1) / 2));
	const tape = g.children.find(o => o.name === 'tape'), tp = tape.getWorldPosition(V3()), o = G.camera.getWorldPosition(V3());
	rc.set(o, tp.sub(o).normalize()); P.paper.press(rc);
	say(!P.paper.shown(), 'sheet: a press on the tape takes it down');
	say(Math.abs(g.scale.x - 0.8) < 1e-6, 'sheet: 0.8× on a wall', g.scale.x);

	// 6b. the languages: the German guard is served, the words switch
	const de = await fetch('/res/sound/guard/de/lines.json').then(r => r.ok ? r.json() : null);
	const mp3 = await fetch('/res/sound/guard/de/greet-0.mp3', { method: 'HEAD' }).then(r => r.ok);
	say(de && Object.keys(de).length === 17 && mp3, 'guard: German lines and recordings served', de ? Object.keys(de).length + ' kinds' : 'no lines.json');
	const Lg = await mod('lang'), lang0 = G.state.settings.lang;
	G.setSetting('lang', 'de'); const deWord = Lg.t('favourites'); G.setSetting('lang', lang0);
	say(deWord === 'Favoriten' && Lg.t('favourites') === (lang0 === 'de' ? 'Favoriten' : 'favourites'), 'lang: t() follows the setting', deWord);

	// 7. a doubled label takes its shadow along
	let card = null; G.scene.getObjectByName('pieces').traverse(x => { if (!card && x.name === 'label' && x.parent.userData.labels) card = x; });
	const rims = G.scene.getObjectByName('label-rims'), r = rims.userData.ranges.get(card.userData.rim), Pa = rims.geometry.attributes.position;
	const before = V3(Pa.getX(r.start), Pa.getY(r.start), Pa.getZ(r.start));
	G.zoomLabel(card.parent.userData.labels); G.scene.updateMatrixWorld(true);
	const after = V3(Pa.getX(r.start), Pa.getY(r.start), Pa.getZ(r.start));
	say(before.distanceTo(after) > 0.02, 'label: the doubled card moves its shadow', `${before.distanceTo(after).toFixed(3)} m`);
	G.zoomLabel(card.parent.userData.labels);

	// 8. the instant lift: X pins the strip, the rail scrubs, the print pressed lays the way, the door spot switches in the dark
	G.walk.pos.set(-G.state.room.W / 2 + 1.4, 1.6, 0.3); G.walk.yaw = Math.PI / 2; G.walk.pitch = 0; G.stepWalk(performance.now()); G.scene.updateMatrixWorld(true); G.camera.updateMatrixWorld(true);
	if (G.stripLift.shown()) w.dispatchEvent(new w.KeyboardEvent('keydown', { code: 'KeyX' }));
	w.dispatchEvent(new w.KeyboardEvent('keydown', { code: 'KeyX' })); await sleep(150);
	const st = G.scene.getObjectByName('strip');
	say(G.stripLift.shown() && st && Math.abs(st.position.x - (-G.state.room.W / 2)) < 0.2, 'strip: X pins it on the wall aimed at');
	st.updateWorldMatrix(true, true);
	const aimAt = (obj, local) => { const p = obj.localToWorld(local.clone()); const o = G.camera.getWorldPosition(V3()); return new THREE.Raycaster(o, p.sub(o).normalize()); };
	const rail = st.getObjectByName('strip-rail'), pr = await mod('press');
	pr.pressAlong(aimAt(rail, V3(0, 0.45, 0)), 3); const nTop = G.stripLift.chosen().n;
	G.stripLift.scrub(aimAt(rail, V3(0, -0.55, 0))); const nBottom = G.stripLift.chosen().n; G.stripLift.release();
	say(nTop > nBottom, 'strip: the rail scrubs, newest at the top', `${nTop} above ${nBottom}`);
	pr.pressAlong(aimAt(rail, V3(0, 0.2, 0)), 3); const nRail = G.stripLift.chosen().n, fineStrip = st.getObjectByName('strip-fine');
	G.stripLift.scrub(aimAt(fineStrip, V3(0, 0.1, 0))); G.stripLift.scrub(aimAt(fineStrip, V3(0, -0.1, 0))); const nFine = G.stripLift.chosen().n;
	G.stripLift.scrub(aimAt(rail, V3(0, 0.2, 0))); const nBack = G.stripLift.chosen().n; G.stripLift.release();
	say(nFine !== nRail && Math.abs(nFine - nRail) < 40 && nBack === nRail, 'strip: held, crossing to the grey strip scrubs finely and back to the rail coarsely', `${nRail} → ${nFine} → ${nBack}`);
	pr.pressAlong(aimAt(st.getObjectByName('strip-card'), V3(0, 0, 0)), 3); await sleep(120);   // the guide is laid on the next frame
	const jg = G.scene.getObjectByName('jump-guide');
	say(G.scene.getObjectByName('strip-ring').visible && !!(jg && jg.visible), 'strip: the print pressed lays the way to the lift and its circle');
	const ring = G.scene.getObjectByName('strip-ring'), room0 = G.state.roomKey, keyTo = (await mod('hang')).rooms().find(r => !r.favs && r.specs.some(s => s.photos.some(q => q.n === G.stripLift.chosen().n))).key;
	const Wy = await mod('way'), Hg = await mod('hang'), toLay = Hg.layoutFor(keyTo), here = { shape: G.state.room.shape, blocks: Wy.blocksFor(G.state.placed, G.state.room.W, G.state.room.D) }, there = { shape: toLay.shape, blocks: Wy.blocksFor(toLay.lay.placed, toLay.shape.W, toLay.shape.D) };
	const spotL = G.world.worldToLocal(ring.position.clone()), roomFor = r => Wy.inside(spotL.x, spotL.z, r.shape, 0.4) && !r.blocks.some(o => spotL.x > o.x0 - 0.1 && spotL.x < o.x1 + 0.1 && spotL.z > o.z0 - 0.1 && spotL.z < o.z1 + 0.1);
	say(ring.visible && roomFor(here) && roomFor(there), 'strip: the circle stands where an 80 cm circle is free here and on the print\'s floor', `${spotL.x.toFixed(2)}, ${spotL.z.toFixed(2)} for ${room0} and ${keyTo}`);
	const spot = ring.position;
	G.walk.pos.set(spot.x, 1.6, spot.z); G.stepWalk(performance.now());
	const t3 = performance.now(); while (G.state.roomKey === room0 && performance.now() - t3 < 9000) await sleep(100);
	const tDark = performance.now() - t3;
	// in the dark: nothing that lights itself shows but the floor and the chalk
	let bright = [];
	G.scene.traverse(o => { if (!o.visible || !o.material || o.name === 'floor') return; for (const m of [].concat(o.material)) { if (m.userData.noDim) continue; const unlit = m.isMeshBasicMaterial || m.isSpriteMaterial; const c = unlit ? Math.max(m.color.r, m.color.g, m.color.b) : m.emissive ? m.emissiveIntensity : 0; if (c > 0.05) bright.push(`${o.name || m.type} ${c.toFixed(2)}`); } });
	const stayed = Math.hypot(G.walk.pos.x - spot.x, G.walk.pos.z - spot.z) < 0.05;
	say(G.state.roomKey !== room0 && !bright.length && stayed, 'switch: in the dark only the floor and the chalk show, and the body stays where it stood', `${bright.length} bright: ${bright.slice(0, 4).join(' | ')}`);
	while (G.scene.getObjectByName('ambient').intensity < 1 && performance.now() - t3 < 23000) await sleep(100);   // 6 s dark, up to 10 s for the pictures, 4 s up
	say(G.state.roomKey !== room0 && G.scene.getObjectByName('ambient').intensity > 0.5 && !G.stripLift.shown(), 'strip: standing at the door switches the room in the dark and lights it again', `${room0} → ${G.state.roomKey} · dark for ${Math.round(tDark)} ms, lit after ${Math.round(performance.now() - t3)} ms`);
	// 9. every floor's layout: a walkway round every row's end, every hung piece reachable from the lift
	const lays = Hg.openRooms().map(r => [r.key, Hg.layoutFor(r.key)]);
	const badLay = lays.filter(([k, l]) => l.lay.rest.length || l.lay.unreachable);
	say(!badLay.length, 'layout: every piece on every floor can be walked to from the lift', `${lays.length} floors${badLay.length ? ' · ' + badLay.map(([k, l]) => `${k}: ${l.lay.rest.length} left, ${l.lay.unreachable} out of reach`).join(', ') : ''}`);
	// 10. the chalk in the new room: round every row, an arrow at the print and no disc; arrived, the arrow alone stays
	const Jm = await mod('jump'), jg2 = G.scene.getObjectByName('jump-guide');
	const legs = jg2.children.filter(m => m.geometry.type === 'PlaneGeometry'), rows = G.state.obstacles;
	let through = 0;
	for (const m of legs) { const len = m.geometry.parameters.height, d = V3(0, 0, -1).applyEuler(m.rotation); for (let t = 0; t <= len; t += 0.05) { const q = m.position.clone().addScaledVector(d, t); if (rows.some(o => q.x > o.x0 + 0.2 && q.x < o.x1 - 0.2 && q.z > o.z0 + 0.2 && q.z < o.z1 - 0.2)) { through++; break; } } }
	const arrow = jg2.getObjectByName('arrow');
	say(jg2.visible && legs.length >= 2 && !through && arrow && !jg2.getObjectByName('spot'), 'chalk: legs round every row, an arrow at the print, no disc', `${legs.length} legs, ${through} through a row`);
	const goal = G.world.localToWorld(arrow.position.clone()); G.walk.pos.set(goal.x, 1.6, goal.z); G.stepWalk(performance.now()); Jm.stepJump(performance.now());
	const arrowOnly = jg2.visible && jg2.children.every(m => m.visible === (m === arrow));
	Jm.stepJump(performance.now() + 31000);
	say(arrowOnly && !jg2.visible, 'chalk: arrived, the arrow alone stays, gone after 30 s');

	say(!errors.length, 'still no errors on the console', errors.slice(0, 3).join(' | '));
	lines.push(fails ? `<span class="fail">${fails} failed</span>` : '<span class="ok">all ok</span>');
	out.innerHTML = lines.join('\n');
}
</script>
</body>
</html>
