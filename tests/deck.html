<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>deck checks</title>
<style>
	body { margin: 0; background: #151412; color: #e8e4dc; font: 13px/1.5 ui-monospace, Menlo, monospace; display: flex; gap: 24px; padding: 16px; }
	iframe { border: 0; width: 390px; height: 844px; flex: none; background: #000; }
	#out { white-space: pre-wrap; flex: 1; }
	.ok { color: #7fd48a; } .fail { color: #f08a7a; } .warn { color: #d8c27a; }
	h1 { font-size: 13px; margin: 0 0 8px; }
</style>
</head>
<body>
<iframe id="f" src="../index.html?touch=1&tablet=0#427"></iframe>
<div><h1>deck checks — the page at 390×844, the phone's deck, driven by synthetic touches</h1><div id="out">loading…</div></div>
<script>
/* One page, no runner: open it from the local server (tests/deck.html) in a
   Chrome window that is actually on screen — an occluded tab paints no
   frames and every transition stalls, which the first check reports.
   Each check is a line: ok / FAIL with what was seen. Add a check when a
   deck behaviour changes; the expectations are the documented ones in
   docs/details.md. */
const out = document.getElementById('out');
const lines = [];
let fails = 0;
function say(ok, name, seen) {
	lines.push(`<span class="${ok ? 'ok' : 'fail'}">${ok ? 'ok  ' : 'FAIL'}</span> ${name}${seen !== undefined ? '  <span class="warn">' + seen + '</span>' : ''}`);
	if (!ok) fails++;
	out.innerHTML = lines.join('\n');
}
const sleep = (ms) => new Promise(r => setTimeout(r, ms));

const f = document.getElementById('f');
f.addEventListener('load', () => run().catch(e => say(false, 'harness threw', e.message)));

async function run() {
	const w = f.contentWindow, d = w.document;
	await sleep(1500);
	const main = d.querySelector('.main');
	const top = () => d.querySelector('section.current .awbox').dataset.n;
	const mover = () => d.querySelector('section.mover');
	const T = (type, x, y) => {
		const t = new w.Touch({ identifier: 1, target: main, clientX: x, clientY: y });
		main.dispatchEvent(new w.TouchEvent(type, { touches: type === 'touchend' ? [] : [t], changedTouches: [t], bubbles: true, cancelable: true }));
	};
	const swipe = async (from, to, steps = 5, ms = 16) => {
		T('touchstart', 200, from);
		for (let i = 1; i <= steps; i++) { await sleep(ms); T('touchmove', 200, from + (to - from) * i / steps); }
	};
	const tap = async (y) => { T('touchstart', 200, y); await sleep(60); T('touchend', 200, y); };
	// wait for the move in flight to land (the watchdog is 2.5 s)
	const settled = async () => { const until = performance.now() + 3200; while (mover() && performance.now() < until) await sleep(30); await sleep(30); };

	// 0. the tab paints — otherwise nothing below can settle
	let frames = 0; const stop = performance.now() + 300;
	await new Promise(r => { const g = () => { frames++; if (performance.now() < stop) w.requestAnimationFrame(g); else r(); }; w.requestAnimationFrame(g); setTimeout(r, 600); });
	say(frames > 5, 'the tab paints (rAF runs)', `${frames} frames in 300 ms — if 0, bring this window to the front and reload`);

	// 1. viewport: the sheet reaches the glass, from CSS, not from JS
	const appH = w.getComputedStyle(d.documentElement).getPropertyValue('--app-height').trim();
	say(appH === '100lvh', '--app-height is 100lvh (never dvh, never measured)', appH);
	say(!d.documentElement.style.getPropertyValue('--app-height'), 'no inline --app-height set by JS');
	const cur = d.querySelector('section.current').getBoundingClientRect();
	say(Math.abs(cur.bottom - (w.innerHeight - 3)) < 1, 'top sheet ends 3 px above the bottom', `bottom ${cur.bottom} of ${w.innerHeight}`);
	say(Math.abs(d.querySelector('.main').getBoundingClientRect().height - w.innerHeight) < 1, '.main is the viewport height');

	// 1b. the words keep their x on a flat sheet and on an inset one
	const capOf = (sel) => d.querySelector(sel + ' .subtitle .cap').getBoundingClientRect();
	const cx = capOf('section.current'), nx = capOf('section.next');
	say(Math.abs(cx.right - nx.right) < 0.5 && Math.abs(cx.left - nx.left) < 0.5, 'captions stand at the same x on the top sheet (inset) and the flat one beneath', `${cx.right.toFixed(1)} vs ${nx.right.toFixed(1)}`);

	// 2. the title lies on the pile: above the resting sheets, under the mover
	say(w.getComputedStyle(d.querySelector('h1.title')).zIndex === '5', 'title z-index 5');

	// 3. put back (swipe down): paper at once, shadow by position, lands
	const start = top();
	await swipe(300, 312, 1);
	let m = mover();
	say(!!m && m.getBoundingClientRect().bottom > 5 && m.getBoundingClientRect().bottom < 20, 'after 12 px of swipe-down the sheet is already on screen', m && `bottom ${Math.round(m.getBoundingClientRect().bottom)}`);
	await swipe(312, 360, 2);
	const shade60 = parseFloat(m.style.getPropertyValue('--shade-in'));
	say(shade60 > 0.3 && shade60 < 0.9, 'shadow rises with the entry (--shade-in at ~60 px)', shade60);
	say(w.getComputedStyle(m).transitionProperty.indexOf('box-shadow') === -1, 'the mover does not transition its shadow');
	await swipe(360, 450, 3);
	T('touchend', 200, 450);
	await sleep(40);
	const settleFlick = parseFloat(m.style.getPropertyValue('--settle'));
	say(settleFlick >= 0.25 && settleFlick < 1.2, 'a flick settles faster than the paper pace', `${settleFlick}s`);
	await settled();
	say(!mover(), 'the put-back landed');
	say(top() !== start, 'the pile shows the sheet before (wrapping past the newest)', `${start} → ${top()}`);
	say(!d.querySelector('section[style*="settle"]') && !d.querySelector('section[style*="shade-in"]'), 'inline --settle / --shade-in cleared after landing');

	// 4. lift off (swipe up): lands on the next older
	const before = top();
	await swipe(600, 450);
	m = mover();
	say(!!m && !m.style.getPropertyValue('--shade-in'), 'lifting off, the shadow is full (no --shade-in)');
	T('touchend', 200, 450);
	await settled();
	say(!mover() && top() === start, 'the lift landed back on the sheet it came from', `${before} → ${top()}`);

	// 5. a slow push keeps the paper's own pace
	await swipe(600, 300, 20, 45);
	m = mover();
	await sleep(250);   // the finger rests before letting go (longer than the 100 ms speed window)
	T('touchend', 200, 300);
	await sleep(40);
	say(parseFloat(m.style.getPropertyValue('--settle')) === 1.2, 'a finger that stopped before letting go gets 1.2 s', m.style.getPropertyValue('--settle'));
	await settled();

	// 6. taps: 1 s, and a touch in the last 15 % of a settle is taken
	const t0 = top();
	await tap(150);
	m = mover();
	say(!!m && m.style.getPropertyValue('--settle') === '1s', 'a tap settles in 1 s', m && m.style.getPropertyValue('--settle'));
	await sleep(250);
	await tap(150);
	say(mover() === m, 'a tap at 30 % of a settle is ignored');
	await sleep(600);
	await tap(150);
	await sleep(60);
	say(mover() && mover() !== m, 'a tap at ~90 % lands the move and starts the next');
	await settled();
	say(top() !== t0 && !mover(), 'two taps forward landed', `${t0} → ${top()}`);

	// 7. the tap divider is set
	const div = w.getComputedStyle(d.documentElement).getPropertyValue('--divider-y').trim();
	say(/px$/.test(div) && parseFloat(div) > 100, 'the tap divider is placed', div);

	// 8. the scrubber: one numbered print, clear of the thumb, the gears named
	const scrub = d.querySelector('.scrub'), strip = d.querySelector('.scrub-strip');
	const r = strip.getBoundingClientRect();
	const S = (type, x, y) => {
		const t = new w.Touch({ identifier: 2, target: scrub, clientX: x, clientY: y });
		scrub.dispatchEvent(new w.TouchEvent(type, { touches: type === 'touchend' ? [] : [t], changedTouches: [t], bubbles: true, cancelable: true }));
	};
	S('touchstart', r.left + 10, r.top + r.height * 0.4);
	await sleep(280);   // the strip arms on touch and engages after 120 ms
	const label = d.querySelector('.scrub-label'), card = d.querySelector('.scrub-card');
	say(card.querySelectorAll('img').length === 1 && !d.querySelector('.scrub-up') && !d.querySelector('.scrub-down'), 'the label is one print, no neighbours');
	const n = card.querySelector('b');
	say(n && /^\d+$/.test(n.textContent) && w.getComputedStyle(n).webkitTextStrokeWidth === '2px', 'the number is on the print, outlined 2 px', n && n.textContent);
	say((r.left + 10) - label.getBoundingClientRect().right >= 44, 'the label keeps 44 px clear of the finger on the strip', `${Math.round((r.left + 10) - label.getBoundingClientRect().right)} px`);
	const hint = d.querySelector('.scrub-hint');
	const H = () => (hint.dataset.dir === 'l' ? '‹ ' : '') + hint.querySelector('.word').textContent + (hint.dataset.dir === 'r' ? ' ›' : '');
	say(H() === '‹ finer', 'on the strip the hint says ‹ finer', H());
	S('touchmove', r.left - 100, r.top + r.height * 0.4);
	await sleep(100);
	say(H() === '‹ finer' && !hint.hidden, 'first gear: the same hint', H());
	say((r.left - 100) - label.getBoundingClientRect().right >= 44, 'in a gear the label follows the finger, 44 px clear');
	S('touchmove', r.left - 200, r.top + r.height * 0.4);
	await sleep(100);
	say(H() === '‹ finer' && !hint.hidden, 'last gear: the same hint', H());
	S('touchmove', r.left - 150, r.top + r.height * 0.4);
	await sleep(60);
	say(H() === 'coarse ›', 'moving back towards the strip: coarse ›', H());
	S('touchend', r.left - 200, r.top + r.height * 0.4);
	await settled();
	say(!mover(), 'the scrubber cut landed');

	// 9. false starts: the strip arms on touch and scrubs only after 120 ms
	const t1 = top();
	S('touchstart', r.left + 10, r.top + r.height * 0.6);
	await sleep(60);
	say(!d.body.classList.contains('scrubbing'), 'a touch on the strip does not scrub yet (armed only)');
	S('touchend', r.left + 10, r.top + r.height * 0.6);
	await sleep(300);
	say(!mover() && top() === t1, 'a brief touch on the strip cuts nothing', `${t1} → ${top()}`);
	S('touchstart', r.left + 10, r.top + r.height * 0.6);
	await sleep(40);
	S('touchmove', r.left + 10, r.top + r.height * 0.6 + 12);
	await sleep(40);
	say(!d.body.classList.contains('scrubbing'), 'moving along the strip within 120 ms does not engage');
	S('touchend', r.left + 10, r.top + r.height * 0.6 + 12);
	await sleep(300);
	say(!mover() && top() === t1, 'a quick brush along the strip cuts nothing');
	S('touchstart', r.left + 10, r.top + r.height * 0.6);
	await sleep(40);
	S('touchmove', r.left - 40, r.top + r.height * 0.6);
	await sleep(220);
	say(!d.body.classList.contains('scrubbing'), 'a finger that heads sideways off the strip within 120 ms is not a scrub');
	S('touchend', r.left - 40, r.top + r.height * 0.6);
	await sleep(300);
	say(!mover() && top() === t1, 'and cuts nothing');
	S('touchstart', r.left + 10, r.top + r.height * 0.2);
	await sleep(260);
	say(d.body.classList.contains('scrubbing'), 'a finger still down after 120 ms engages');
	S('touchmove', r.left + 10, r.top + r.height * 0.25);
	await sleep(40);
	S('touchend', r.left + 10, r.top + r.height * 0.25);
	await settled();
	say(!mover() && top() !== t1, 'and lets go into a cut', `${t1} → ${top()}`);

	// 10. the left strip: the same, mirrored
	const ls = d.querySelector('.scrub.left'), lstrip = ls.querySelector('.scrub-strip'), lr = lstrip.getBoundingClientRect();
	say(lr.left < 20 && lr.right < 30, 'a strip stands at the left edge too', `${Math.round(lr.left)}–${Math.round(lr.right)}`);
	const L = (type, x, y) => {
		const t = new w.Touch({ identifier: 3, target: ls, clientX: x, clientY: y });
		ls.dispatchEvent(new w.TouchEvent(type, { touches: type === 'touchend' ? [] : [t], changedTouches: [t], bubbles: true, cancelable: true }));
	};
	const t3 = top();
	L('touchstart', lr.right - 4, lr.top + lr.height * 0.5);
	await sleep(200);
	say(d.body.classList.contains('scrubbing'), 'the left strip engages after 120 ms');
	const lb = label.getBoundingClientRect();
	say(lb.left - (lr.right - 4) >= 44 && label.classList.contains('left'), 'the label stands to the right of the finger, 44 px clear', `${Math.round(lb.left - (lr.right - 4))} px`);
	say(H() === 'finer ›', 'the hint points right', H());
	L('touchmove', lr.right + 100, lr.top + lr.height * 0.5);
	await sleep(100);
	say(H() === 'finer ›' && !hint.hidden, 'sliding right: the chevron points right', H());
	L('touchend', lr.right + 100, lr.top + lr.height * 0.5);
	await settled();
	say(!mover() && top() !== t3, 'letting go cuts', `${t3} → ${top()}`);

	lines.push('', fails ? `<span class="fail">${fails} failed</span>` : '<span class="ok">all passed</span>');
	out.innerHTML = lines.join('\n');
	document.title = (fails ? `${fails} FAIL — ` : 'ok — ') + 'deck checks';
}
</script>
</body>
</html>
