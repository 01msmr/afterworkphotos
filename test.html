<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
	<meta name="color-scheme" content="light">
	<meta name="theme-color" content="#dedede">
	<title>awp viewport test</title>
	<!-- Its own manifest, so "Add to Home Screen" on this page gives a
	     standalone app of this page — the same conditions as the real one. -->
	<link rel="manifest" href="/test-manifest.json">
	<link rel="apple-touch-icon" href="/apple-touch-icon.png">
	<meta name="apple-mobile-web-app-title" content="awp test">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
	<style>
		* { box-sizing: border-box; margin: 0; padding: 0; }
		html, body { height: 100%; background: #000; color: #fff; font: 13px/1.5 -apple-system, monospace; }

		/* Three boxes pinned to the bottom by three different means. Whichever
		   stops short of the glass tells which measure iOS gets wrong. */
		.fixed  { position: fixed; left: 0; right: 0; top: 0; bottom: 0; border: 4px solid #e33; }          /* fixed, bottom: 0 → red */
		.dvh    { position: absolute; left: 12px; width: 12px; top: 0; height: 100dvh; background: #3c3; }   /* 100dvh → green bar */
		.lvh    { position: absolute; left: 30px; width: 12px; top: 0; height: 100lvh; background: #36f; }   /* 100lvh → blue bar */
		.inner  { position: absolute; left: 48px; width: 12px; top: 0; background: #fc0; }                   /* innerHeight → yellow bar (JS) */
		.safe   { position: fixed; left: 0; right: 0; bottom: 0; height: env(safe-area-inset-bottom, 0px); background: rgba(255,255,255,0.35); } /* the home-indicator inset → grey */

		pre {
			position: fixed; left: 72px; right: 12px; top: calc(env(safe-area-inset-top, 0px) + 12px);
			white-space: pre-wrap; word-break: break-all; color: #0f0; font: 12px/1.5 monospace;
		}
		p { position: fixed; left: 72px; right: 12px; bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); color: #aaa; }
	</style>
</head>
<body>
	<div class="fixed"></div>
	<div class="dvh"></div>
	<div class="lvh"></div>
	<div class="inner"></div>
	<div class="safe"></div>
	<pre id="out"></pre>
	<p>red frame: fixed bottom:0 · green: 100dvh · blue: 100lvh · yellow: innerHeight · grey strip: safe-area-inset-bottom. All should reach the glass. Add to Home Screen to see it standalone.</p>
	<script>
		function read() {
			const probe = document.createElement('div');
			probe.style.cssText = 'position:fixed;visibility:hidden;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)';
			document.body.appendChild(probe);
			const p = getComputedStyle(probe);
			const vv = window.visualViewport;
			const fixed = document.querySelector('.fixed').getBoundingClientRect();
			document.querySelector('.inner').style.height = innerHeight + 'px';
			document.getElementById('out').textContent = [
				`screen ${screen.width}×${screen.height} @${devicePixelRatio}`,
				`availHeight ${screen.availHeight}`,
				`inner ${innerWidth}×${innerHeight}  outer ${outerWidth}×${outerHeight}`,
				`visualViewport ${vv ? Math.round(vv.width) + '×' + Math.round(vv.height) + ' top ' + Math.round(vv.offsetTop) : '-'}`,
				`doc client ${document.documentElement.clientWidth}×${document.documentElement.clientHeight}`,
				`fixed box ${Math.round(fixed.top)} → ${Math.round(fixed.bottom)}`,
				`safe-area top ${p.paddingTop} bottom ${p.paddingBottom}`,
				`standalone ${matchMedia('(display-mode: standalone)').matches} / ${navigator.standalone}`,
				`${new Date().toISOString().slice(0, 19)}`,
				navigator.userAgent,
			].join('\n');
			probe.remove();
		}
		read();
		addEventListener('resize', read);
		if (visualViewport) visualViewport.addEventListener('resize', read);
		setTimeout(read, 500);
	</script>
</body>
</html>
