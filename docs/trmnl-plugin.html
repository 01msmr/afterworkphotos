<!-- TRMNL private plugin markup — the full view. Strategy: None.

     The src is one fixed address. Behind it trmnl/photo.php draws a name out of
     today's pool and writes the file out, so every refresh fetches the same URL
     and gets a different photograph. No Liquid, no data, no selection here.

     TRMNL X is 1040x780 CSS px at pixel ratio 1.8 = 1872x1404 physical, so the
     markup is written in CSS pixels. Every length below is stated in PHYSICAL
     pixels and multiplied by --css, which keeps the figures the same ones that
     were measured on the panel. The 1200 px photograph lands on 666.67 CSS px
     = 1200.0 device px: still 1:1, nothing resampled.

       surround #999999 = 153        print 1200x1200 centred, corners 24px
       shoulder 12 px outside        floor fillet 8 px inside

     The sheet descends continuously from the surround to the floor of the
     recess, so the shading is ONE band peaking at the border: the floor fillet
     is the shoulder rotated 180 deg about x — same colours, offsets negated,
     lengths 8/12. Lit side held at 0.44 / 0.25 so the highlight tops out one
     ramp step below the shadow's depth.

     The view is given no size of its own: view--full is already the screen.
     Turn off the bleed margin in the plugin settings, or the surround is inset
     and stops meeting the frame. -->

<style>
  .awp {
    --dpr: 1.8;                      /* physical pixels per CSS pixel */
    --css: calc(1 / var(--dpr));     /* a multiplier: division by a var is not safe */
    --print: calc(1200px * var(--css));
    --r: calc(24px * var(--css));
    margin: 0; padding: 0;
    background: #999999;
    display: flex; align-items: center; justify-content: center;
  }

  /* the shoulder: 12 px of paper rolled down into the recess */
  .awp-print {
    position: relative;
    width: var(--print); height: var(--print);
    border-radius: var(--r);
    box-shadow:
      0 calc(-5px * var(--css)) calc(9px * var(--css))  rgba(40,30,20,0.46),
      calc(-5px * var(--css)) 0 calc(9px * var(--css))  rgba(40,30,20,0.27),
      0 calc(7px * var(--css)) calc(10px * var(--css))  rgba(255,255,255,0.44),
      calc(6px * var(--css)) 0 calc(9px * var(--css))   rgba(255,255,255,0.25);
  }

  .awp-print img { display: block; width: var(--print); height: var(--print);
                   border-radius: var(--r); }

  .awp-print::before, .awp-print::after {
    content: ""; position: absolute; inset: 0;
    border-radius: var(--r); pointer-events: none;
  }

  /* the floor fillet: 8 px, the sheet flattening onto the recess floor */
  .awp-print::before {
    box-shadow:
      inset 0 calc(3.3px * var(--css)) calc(6px * var(--css))    rgba(40,30,20,0.46),
      inset calc(3.3px * var(--css)) 0 calc(6px * var(--css))    rgba(40,30,20,0.27),
      inset 0 calc(-4.7px * var(--css)) calc(6.7px * var(--css)) rgba(255,255,255,0.44),
      inset calc(-4px * var(--css)) 0 calc(6px * var(--css))     rgba(255,255,255,0.25);
  }

  /* the crest: the sharp line of the border itself */
  .awp-print::after {
    box-shadow:
      inset 0 calc(1px * var(--css)) 0  rgba(40,30,20,0.42),
      inset 0 calc(-1px * var(--css)) 0 rgba(255,255,255,0.14);
  }
</style>

<div class="view view--full awp">
  <div class="awp-print">
    <img class="image-dither" src="https://afterworkphotos.com/trmnl/photo.php">
  </div>
</div>
