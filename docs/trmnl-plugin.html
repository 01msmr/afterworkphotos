<!-- TRMNL private plugin markup — the full view. Strategy: None.

     The src is one fixed address. Behind it trmnl/photo.php draws a name out of
     today's pool and writes the file out, so every refresh fetches the same URL
     and gets a different photograph. No Liquid, no data, no selection here.

     TRMNL X is 1040x780 CSS px at pixel ratio 1.8 = 1872x1404 physical, so the
     markup is written in CSS pixels. Every length below is stated in PHYSICAL
     pixels and multiplied by --css, which keeps the figures the same ones that
     were measured on the panel. The 1200 px photograph lands on 666.67 CSS px
     = 1200.0 device px: still 1:1, nothing resampled.

       surround #999999 = 153        print 1200x1200 centred, corners 24px
       outline 3 px, white; black under .screen--dark-mode

     Three physical pixels is 0.33 mm, and an arcminute of acuity is about
     0.29 mm at a metre — so 3 px is the thinnest line that still reads as
     deliberate from across the room. 1 px is finer than the eye resolves there
     and 2 px sits exactly on the threshold. Screen instinct is no guide at
     227 PPI. Both 255 and 0 are exact steps on the 16 grey ramp, so the line
     never dithers; only the corners soften.

     The ring is a box-shadow spread rather than an outline: spread has followed
     border-radius in every browser for a decade, outline only since Chrome 94.

     The view is given no size of its own: view--full is already the screen.
     Turn off the bleed margin in the plugin settings, or the surround is inset
     and stops meeting the frame. -->

<style>
  .awp {
    --dpr: 1.8;                      /* physical pixels per CSS pixel */
    --css: calc(1 / var(--dpr));     /* a multiplier: division by a var is not safe */
    --print: calc(1200px * var(--css));
    --r: calc(24px * var(--css));
    --line: #ffffff;                 /* light mode */
    margin: 0; padding: 0;
    background: #999999;
    display: flex; align-items: center; justify-content: center;
  }

  .screen--dark-mode .awp { --line: #000000; }

  .awp-print {
    width: var(--print); height: var(--print);
    border-radius: var(--r);
    box-shadow: 0 0 0 calc(3px * var(--css)) var(--line);
  }

  .awp-print img { display: block; width: var(--print); height: var(--print);
                   border-radius: var(--r); }
</style>

<div class="view view--full awp">
  <div class="awp-print">
    <img class="image-dither" src="https://afterworkphotos.com/trmnl/photo.php">
  </div>
</div>
