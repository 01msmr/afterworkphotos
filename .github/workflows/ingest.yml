# Turns whatever lands in inbox/ into the next numbered photo, and keeps
# the thumbnails and photos.json current.
#
# The Shortcut on the phone PUTs a photo into inbox/ through the GitHub
# contents API; that push triggers this. scripts/ingest.sh numbers it, makes
# the 1000px square derivative and the 200px thumbnail, moves the original,
# bumps PHOTO_COUNT and rewrites photos.json; this workflow commits and
# pushes. The server pulls main and the photo is live. A push made with
# GITHUB_TOKEN does not trigger workflows, so the commit made here cannot
# start another run. Run it by hand (workflow_dispatch) to regenerate the
# derived data with an empty inbox.
name: ingest photos

on:
  push:
    branches: [main]
    paths: ['inbox/**']
  workflow_dispatch:

permissions:
  contents: write

# one at a time, in order — two uploads must not both become photo N
concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ImageMagick and ffmpeg
        run: |
          if ! command -v convert >/dev/null || ! command -v ffmpeg >/dev/null; then
            sudo apt-get update && sudo apt-get install -y imagemagick ffmpeg
          fi
          convert -version | head -1
          ffmpeg -version | head -1

      - name: ingest
        id: ingest
        run: |
          chmod +x scripts/ingest.sh
          scripts/ingest.sh | tee ingest.log
          echo "message=$(tail -1 ingest.log)" >> "$GITHUB_OUTPUT"
          rm -f ingest.log

      - name: commit and push
        run: |
          git config user.name "afterworkphotos ingest"
          git config user.email "ingest@afterworkphoto.com"
          git add -A inbox img "img originals" res/main.js photos.json
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "${{ steps.ingest.outputs.message }}"
          # someone may have pushed meanwhile
          git pull --rebase origin main
          git push origin HEAD:main
