<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
	<meta name="color-scheme" content="dark">
	<meta name="theme-color" content="#111111">
	<title>afterworkphotos — gallery</title>
	<link rel="stylesheet" href="/res/gallery.css?v=20260919b">
	<link rel="apple-touch-icon" href="/apple-touch-icon.png">
</head>
<body>
	<!-- the three.js canvas lands here; nothing else lives in the DOM until
	     the elevator overlay and the switchboard panel arrive (tasks 1.5, 1.6) -->
	<main id="stage"></main>
	<!-- the bench's one instruction; hidden while the pointer is taken -->
	<p id="hint">click to look around &middot; W A S D to walk &middot; &larr; &rarr; to turn &middot; Q E to lower and raise the eye &middot; V to kneel &middot; R calls the lift, then , and . for its floors &middot; F for the floors &middot; B or O for the settings &middot; Esc to let go</p>
	<!-- the elevator's floors as a list, for the bench: Y toggles it -->
	<nav id="floors" hidden aria-label="Floors"></nav>
	<!-- shown only where the browser can do immersive VR: the Quest -->
	<button id="vr" hidden>Enter VR</button>
	<!-- The modules' version, once (2026-09-19): a module is its URL, so every import goes
	     through this map, written here from V before the first module is fetched — a
	     change bumps V alone. A new module goes into the list. -->
	<script>
		const V = '1.0.8';
		const modules = ['bake', 'bench', 'elevator', 'frames', 'guard', 'hang', 'jump', 'music', 'paper', 'plan', 'room', 'scene', 'state', 'sticker', 'tablet', 'video', 'vr', 'walk', 'zoom'];
		const imports = { gallery: `/res/gallery.js?v=${V}` };
		for (const m of modules) imports[`gallery/${m}`] = `/res/gallery/${m}.js?v=${V}`;
		const map = document.createElement('script');
		map.type = 'importmap';
		map.textContent = JSON.stringify({ imports });
		document.currentScript.after(map);
	</script>
	<script type="module">import 'gallery';</script>
</body>
</html>
