<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
	<meta name="color-scheme" content="dark">
	<meta name="theme-color" content="#111111">
	<title>afterworkphotos — gallery</title>
	<link rel="stylesheet" href="/res/gallery.css?v=20260905a">
	<link rel="apple-touch-icon" href="/apple-touch-icon.png">
</head>
<body>
	<!-- the three.js canvas lands here; nothing else lives in the DOM until
	     the elevator overlay and the switchboard panel arrive (tasks 1.5, 1.6) -->
	<main id="stage"></main>
	<!-- the bench's one instruction; hidden while the pointer is taken -->
	<p id="hint">click to look around &middot; W A S D to walk &middot; V to kneel &middot; Y for the floors &middot; S for the switchboard &middot; Esc to let go</p>
	<!-- the elevator's floors as a list, for the bench: Y toggles it -->
	<nav id="floors" hidden aria-label="Floors"></nav>
	<!-- shown only where the browser can do immersive VR: the Quest -->
	<button id="vr" hidden>Enter VR</button>
	<!-- the switchboard, for the bench: S toggles it -->
	<form id="board" hidden aria-label="Switchboard" onsubmit="return false"></form>
	<script type="module" src="/res/gallery.js?v=20260905g"></script>
</body>
</html>
