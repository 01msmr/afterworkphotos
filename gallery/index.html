<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
	<meta name="color-scheme" content="dark">
	<meta name="theme-color" content="#111111">
	<title>afterworkphotos — gallery</title>
	<link rel="stylesheet" href="/res/gallery.css?v=20260905b">
	<link rel="apple-touch-icon" href="/apple-touch-icon.png">
</head>
<body>
	<!-- the three.js canvas lands here; nothing else lives in the DOM until
	     the elevator overlay and the switchboard panel arrive (tasks 1.5, 1.6) -->
	<main id="stage"></main>
	<!-- the bench's one instruction; hidden while the pointer is taken -->
	<p id="hint">click to look around &middot; W A S D to walk &middot; &larr; &rarr; to turn &middot; Q E to lower and raise the eye &middot; V to kneel &middot; R calls the lift, then , and . for its floors &middot; F for the floors &middot; B or O for the settings &middot; Esc to let go</p>
	<!-- the elevator's floors as a list, for the bench: Y toggles it -->
	<nav id="floors" hidden aria-label="Floors"></nav>
	<!-- shown only where the browser can do immersive VR: the Quest -->
	<button id="vr" hidden>Enter VR</button>
	<!-- The one place the modules' version lives (2026-09-19): a module is its URL, so
	     every import goes through this map and a change bumps the ?v= here alone —
	     sed -i '' 's/?v=OLD/?v=NEW/g' gallery/index.html -->
	<script type="importmap">
	{
		"imports": {
			"gallery": "/res/gallery.js?v=20260919c",
			"gallery/bake": "/res/gallery/bake.js?v=20260919c",
			"gallery/bench": "/res/gallery/bench.js?v=20260919c",
			"gallery/elevator": "/res/gallery/elevator.js?v=20260919c",
			"gallery/frames": "/res/gallery/frames.js?v=20260919c",
			"gallery/guard": "/res/gallery/guard.js?v=20260919c",
			"gallery/hang": "/res/gallery/hang.js?v=20260919c",
			"gallery/jump": "/res/gallery/jump.js?v=20260919c",
			"gallery/music": "/res/gallery/music.js?v=20260919c",
			"gallery/plan": "/res/gallery/plan.js?v=20260919c",
			"gallery/room": "/res/gallery/room.js?v=20260919c",
			"gallery/scene": "/res/gallery/scene.js?v=20260919c",
			"gallery/state": "/res/gallery/state.js?v=20260919c",
			"gallery/sticker": "/res/gallery/sticker.js?v=20260919c",
			"gallery/tablet": "/res/gallery/tablet.js?v=20260919c",
			"gallery/video": "/res/gallery/video.js?v=20260919c",
			"gallery/vr": "/res/gallery/vr.js?v=20260919c",
			"gallery/walk": "/res/gallery/walk.js?v=20260919c",
			"gallery/zoom": "/res/gallery/zoom.js?v=20260919c"
		}
	}
	</script>
	<script type="module">import 'gallery';</script>
</body>
</html>
