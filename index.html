	<meta name="color-scheme" content="light dark">
	<!-- Experiment: if iOS picks the status bar text colour from theme-color
	     rather than from the pixels beneath, a light value here gives black
	     text — invisible on the black desk -->
	<meta name="theme-color" content="#dedede">
	<title>@maasmeiers afterworkphotos</title>
	<link rel="stylesheet" href="res/main.css">
	<link rel="apple-touch-icon" href="/apple-touch-icon.png">
	<!-- display:standalone is what makes the home screen icon launch as an app
	     rather than a browser window with a bar; the apple-* metas below are
	     the legacy path and no longer enough on their own -->
	<link rel="manifest" href="/manifest.json">
	<meta name="apple-mobile-web-app-title" content="afterworkphotos">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
